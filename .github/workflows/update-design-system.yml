name: Update Design System proposal

on:
  push:
    paths:
      - '.github/workflows/update-design-system.yml'

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Design System proposal to report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_anchor = '.solution .n{color:var(--green)}\n'
          css = '''
          .design-system-box{
            grid-column:1/-1;
            margin-top:2px;padding:18px;border:1px solid #cfd8e3;border-radius:14px;background:#f8fafc
          }
          .design-system-box h3{margin-bottom:6px}
          .design-system-box>p{margin:0;color:var(--muted);font-size:12px;max-width:980px}
          .ds-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
          .ds-layer{padding:13px;border:1px solid #e3e8ef;border-radius:11px;background:#fff}
          .ds-layer small{display:block;font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
          .ds-layer b{display:block;font-size:12px;margin-bottom:4px}
          .ds-layer p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
          .ds-value{margin-top:12px;padding:12px 14px;border-left:3px solid var(--green);background:#fff;border-radius:0 10px 10px 0;font-size:12px;color:#475569}
          '''

          if '.design-system-box{' not in text:
              text = text.replace(css_anchor, css_anchor + css)

          responsive_anchor = '  .patterns,.solutions,.notes{grid-template-columns:1fr}\n}'
          if '.ds-grid{grid-template-columns:1fr}' not in text:
              text = text.replace(
                  responsive_anchor,
                  '  .patterns,.solutions,.notes{grid-template-columns:1fr}\n  .ds-grid{grid-template-columns:1fr}\n}'
              )

          old = '''      <div class="solution"><div class="n">Giải pháp 05</div><h3>Tăng khả năng scan và nhận biết tương tác</h3><p>Tách rõ label/value, thông tin chính/phụ, selected state và control có thể thao tác; giảm các khối có trọng số thị giác ngang nhau.</p></div>
    </div>'''

          new = '''      <div class="solution"><div class="n">Giải pháp 05</div><h3>Tăng khả năng scan và nhận biết tương tác</h3><p>Tách rõ label/value, thông tin chính/phụ, selected state và control có thể thao tác; giảm các khối có trọng số thị giác ngang nhau.</p></div>
      <div class="solution"><div class="n">Giải pháp 06 · Design</div><h3>Xây dựng Design System cho hệ thống quản lý dữ liệu khách sạn</h3><p>Chuẩn hóa nền tảng thiết kế, component và các pattern nghiệp vụ dùng chung để hệ thống có thể mở rộng module, thay đổi quy tắc nghiệp vụ và chỉnh sửa giao diện mà vẫn giữ tính nhất quán.</p></div>

      <div class="design-system-box">
        <h3>Đề xuất cấu trúc Design System</h3>
        <p>Design System không chỉ là thư viện UI. Nên được xây theo 3 lớp để vừa đảm bảo tính nhất quán của sản phẩm, vừa phù hợp với các nghiệp vụ quản lý dữ liệu đặc thù của khách sạn.</p>
        <div class="ds-grid">
          <div class="ds-layer">
            <small>Lớp 01 · Nền tảng</small>
            <b>Foundation</b>
            <p>Màu sắc, typography, spacing, grid, icon, trạng thái, token và quy tắc hiển thị dữ liệu.</p>
          </div>
          <div class="ds-layer">
            <small>Lớp 02 · Thành phần dùng chung</small>
            <b>Core Components</b>
            <p>Form, input, select, date picker, filter, table, card, modal, tabs, badge, feedback và các trạng thái loading/empty/error.</p>
          </div>
          <div class="ds-layer">
            <small>Lớp 03 · Pattern nghiệp vụ khách sạn</small>
            <b>Hotel Domain Patterns</b>
            <p>Allotment matrix, booking status/action, room selection, rate breakdown, guest allocation, payment summary và các pattern quản lý dữ liệu đặc thù.</p>
          </div>
        </div>
        <div class="ds-value"><b>Giá trị mang lại:</b> dễ mở rộng thêm module, giảm thời gian thiết kế và phát triển, chỉnh sửa đồng bộ khi nghiệp vụ thay đổi, hạn chế UI bị lệch giữa các màn và giúp sản phẩm duy trì tính nhất quán khi hệ thống lớn dần.</div>
      </div>
    </div>'''

          if 'Giải pháp 06 · Design' not in text:
              if old not in text:
                  raise SystemExit('Không tìm thấy vị trí chèn giải pháp Design System')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit updated report
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Design System proposal to UX report"
          git push
